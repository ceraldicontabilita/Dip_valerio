name: Verifica sito

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: HTML e immagine Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verifica pagina
        run: test -s ceraldi_presenze.html
      - name: Verifica contenitore
        run: docker build --tag dip-valerio:test .
